{% extends 'base.html' %}
{% block title %}{{ 'Edit Product' if product else 'Add Product' }}{% endblock %}
{% block content %}
<div class="page-heading"><div><p class="eyebrow">Module 4</p><h1>{{ 'Edit Product' if product else 'Add Product' }}</h1></div><a class="btn btn-secondary-soft" href="{{ url_for('modules.production_config_dashboard') }}">Back</a></div>
<div class="panel form-panel"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="row g-3">
{% if not product %}<div class="col-md-6"><label class="form-label">Product code *</label><input class="form-control" name="code" required></div>{% endif %}
<div class="col-md-6"><label class="form-label">Product name *</label><input class="form-control" name="name" value="{{ product.name if product else '' }}" required></div>
<div class="col-md-6"><label class="form-label">Category</label><input class="form-control" name="category" value="{{ product.category if product else 'Snack' }}"></div>
<div class="col-md-6"><label class="form-label">Production section</label><select class="form-select" name="department_id"><option value="">Unassigned</option>{% for department in departments %}<option value="{{ department.id }}" {% if product and product.department_id==department.id %}selected{% endif %}>{{ department.name }}</option>{% endfor %}</select></div>
<div class="col-md-4"><label class="form-label">Packet weight</label><input class="form-control" name="packet_weight" type="number" step="0.001" min="0" value="{{ product.packet_weight if product else 200 }}"></div>
<div class="col-md-4"><label class="form-label">Measurement unit</label><input class="form-control" name="unit" value="{{ product.unit if product else 'gram' }}"></div>
<div class="col-md-4"><label class="form-label">Selling unit</label><input class="form-control" name="selling_unit" value="{{ product.selling_unit if product else 'packet' }}"></div>
<div class="col-md-4"><label class="form-label">Standard batch output *</label><input class="form-control" name="standard_batch_output" type="number" min="1" value="{{ product.standard_batch_output if product else 200 }}" required></div>
<div class="col-md-4"><label class="form-label">Daily target (batches)</label><input class="form-control" name="daily_target_batches" type="number" min="0" value="{{ product.daily_target_batches if product else 2 }}"></div>
<div class="col-md-4"><label class="form-label">Selling price (paise)</label><input class="form-control" name="selling_price_paise" type="number" min="0" value="{{ product.selling_price_paise if product else 0 }}"></div>
<div class="col-md-4"><label class="form-label">GST %</label><input class="form-control" name="gst_percent" type="number" step="0.01" min="0" value="{{ product.gst_percent if product else 5 }}"></div>
{% if product %}<div class="col-md-4"><label class="form-label">Status</label><select class="form-select" name="is_active"><option value="1" {% if product.is_active %}selected{% endif %}>Active</option><option value="0" {% if not product.is_active %}selected{% endif %}>Inactive</option></select></div>{% endif %}
</div><div class="form-actions"><button class="btn btn-primary" type="submit">{{ 'Save Product' if product else 'Create Product' }}</button></div></form></div>
{% endblock %}
