{% extends 'base.html' %}
{% block title %}Add Supplier{% endblock %}
{% block content %}
<div class="page-heading"><div><p class="eyebrow">Module 8</p><h1>Add Supplier</h1></div><a class="btn btn-secondary-soft" href="{{ url_for('modules.purchasing_dashboard') }}">Back</a></div>
<div class="panel form-panel"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="row g-3">
<div class="col-md-6"><label class="form-label">Supplier code *</label><input class="form-control" name="code" required></div>
<div class="col-md-6"><label class="form-label">Supplier name *</label><input class="form-control" name="name" required></div>
<div class="col-md-6"><label class="form-label">Contact person</label><input class="form-control" name="contact_person"></div>
<div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone"></div>
<div class="col-md-6"><label class="form-label">Email</label><input class="form-control" name="email" type="email"></div>
<div class="col-md-6"><label class="form-label">GSTIN</label><input class="form-control" name="gstin"></div>
<div class="col-md-12"><label class="form-label">Address</label><textarea class="form-control" name="address" rows="3"></textarea></div>
<div class="col-md-6"><label class="form-label">Credit days</label><input class="form-control" name="credit_days" type="number" min="0" value="0"></div>
</div><div class="form-actions"><button class="btn btn-primary" type="submit">Create Supplier</button></div></form></div>
{% endblock %}
