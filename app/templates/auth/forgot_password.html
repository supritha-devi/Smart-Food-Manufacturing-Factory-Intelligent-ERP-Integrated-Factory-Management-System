{% extends 'base.html' %}
{% block title %}Forgot Password{% endblock %}
{% block content_full %}<div class="login-page"><div class="login-card"><h1>Reset password</h1><p>Enter your email or username.</p>{% include '_flash.html' %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label class="form-label">Email / Username</label><input class="form-control" name="identifier" required><button class="btn btn-primary w-100 mt-4">Request reset</button></form><a class="d-block text-center mt-3" href="{{ url_for('auth.login') }}">Back to login</a></div></div>{% endblock %}
