{% extends 'base.html' %}
{% block title %}Change Password{% endblock %}
{% block content_full %}<div class="login-page"><div class="login-card"><h1>Change password</h1>{% include '_flash.html' %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label class="form-label">New password</label><input class="form-control" name="password" type="password" minlength="8" required><label class="form-label mt-3">Confirm password</label><input class="form-control" name="confirm_password" type="password" minlength="8" required><button class="btn btn-primary w-100 mt-4">Update password</button></form></div></div>{% endblock %}
