{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="page-heading"><div><p class="eyebrow">OWNER CONTROL</p><h1>{{ title }}</h1></div><a class="btn btn-secondary-soft" href="{{ url_for('users.user_list') }}">Back</a></div>
<div class="panel form-panel">
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="row g-3">
      <div class="col-md-6"><label class="form-label">Employee name *</label><input class="form-control" name="name" value="{{ user.name if user else '' }}" required></div>
      <div class="col-md-6"><label class="form-label">Employee ID *</label><input class="form-control" name="employee_id" value="{{ user.employee_id if user else '' }}" required></div>
      <div class="col-md-6"><label class="form-label">Email address *</label><input class="form-control" name="email" type="email" value="{{ user.email if user else '' }}" required></div>
      <div class="col-md-6"><label class="form-label">Username *</label><input class="form-control" name="username" value="{{ user.username if user else '' }}" required></div>
      <div class="col-md-6"><label class="form-label">Phone number</label><input class="form-control" name="phone" value="{{ user.phone if user else '' }}"></div>
      <div class="col-md-6"><label class="form-label">Assigned role *</label><select class="form-select" name="role_id" required><option value="">Select role</option>{% for role in roles %}<option value="{{ role.id }}" {% if user and user.role_id == role.id %}selected{% endif %}>{{ role.name }}</option>{% endfor %}</select></div>
      {% if not user %}<div class="col-md-12"><label class="form-label">Temporary password *</label><input class="form-control" name="temporary_password" type="password" minlength="8" required></div>{% endif %}
    </div>
    <div class="form-actions"><button class="btn btn-primary" type="submit">{{ 'Save Changes' if user else 'Create Account' }}</button></div>
  </form>
</div>
{% endblock %}
